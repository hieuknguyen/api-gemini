services:
  antigravity-gateway:
    build: .
    container_name: api-gemini
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MYSQL_HOST: mysql_db
      MYSQL_PORT: "3306"
      MYSQL_USER: api_gemini_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: api_gemini_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-https://api-gemini.quackquack.icu/api/accounts/oauth/callback}
      ANTIGRAVITY_PROJECT_ID: ${ANTIGRAVITY_PROJECT_ID:-aicode-consumers}
    volumes:
      - ./accounts.json:/app/accounts.json
      - ./skills.json:/app/skills.json
      - ./settings.json:/app/settings.json
      - ./users.json:/app/users.json
      - ./api_keys.json:/app/api_keys.json
      - ./quota.db:/app/quota.db
    expose:
      - "5678"
    networks:
      - alan
    labels:
      traefik.enable: "true"
      traefik.docker.network: alan
      traefik.http.routers.api-gemini-http.rule: Host(`api-gemini.quackquack.icu`)
      traefik.http.routers.api-gemini-http.entrypoints: web
      traefik.http.routers.api-gemini-http.middlewares: force-https@file
      traefik.http.routers.api-gemini.rule: Host(`api-gemini.quackquack.icu`)
      traefik.http.routers.api-gemini.entrypoints: websecure
      traefik.http.routers.api-gemini.tls: "true"
      traefik.http.routers.api-gemini.tls.certresolver: myresolver
      traefik.http.routers.api-gemini.service: api-gemini
      traefik.http.services.api-gemini.loadbalancer.server.port: "5678"

networks:
  alan:
    external: true
    name: alan
